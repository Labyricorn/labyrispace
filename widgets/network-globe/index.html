<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Globe</title>
<style>
  :root { --bg:#0b1020; --panel:#111a30; --text:#d7e0f0; --dim:#8aa0c0; --line:#22314f; --accent:#3ddcc0; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  :root[data-theme="light"] { --bg:#eef2f8; --panel:#ffffff; --text:#16233b; --dim:#51668a; --line:#c6d3e6; --accent:#0f8f7a; --good:#1e8e3e; --warn:#a86a00; --bad:#b3261e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  .hidden { display: none !important; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .status { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { font-weight: 700; letter-spacing: .04em; }
  .chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.muted { color: var(--dim); }
  .meta { color: var(--dim); } .mono { font-family: ui-monospace, Consolas, monospace; } .dim { color: var(--dim); } .wrap { word-break: break-all; }
  button, select, input[type=text] { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .5; cursor: default; }
  input[type=text] { width: 120px; }
  .check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .notice { margin: 8px 12px 0; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line); }
  .notice.warn { border-color: var(--warn); } .notice.bad { border-color: var(--bad); } .notice.info { color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px 0; }
  .settings { margin: 8px 12px 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
  .settings h3 { margin: 0; font-size: 13px; }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 1.3fr) minmax(280px, 1fr); gap: 0; }
  .globe { min-height: 0; min-width: 0; position: relative; }
  .side { min-height: 0; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
  .tablewrap { flex: 1; min-height: 80px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; color: var(--dim); font-weight: 600; padding: 4px 8px; }
  td { padding: 3px 8px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  tbody tr.selected { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .tools .dim { font-size: 12px; }
  button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
  .sortbtn { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .sortbtn:hover { color: var(--text); }
  .row.tight { padding: 8px 0 0; }
  .trace h4 { margin: 10px 0 4px; font-size: 13px; }
  .hops { margin: 6px 0 0; padding-left: 28px; white-space: pre; }
  .details { border-top: 1px solid var(--line); padding: 8px 12px; max-height: 38%; overflow: auto; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; } dt { color: var(--dim); } dd { margin: 0; }
  .foot { padding: 6px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) { .body { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 1fr) minmax(160px, 1fr); } .side { border-left: 0; border-top: 1px solid var(--line); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">Loading...</div>
<script src="main.js"></script>
</body>
</html>
